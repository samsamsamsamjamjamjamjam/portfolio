<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torts Interactive Tools</title>
  <style>
    :root {
      --wilmu-green: #008350;
      --deep-text-green: #003320;
      --canvas-white: #F9FBF9;
      --body-charcoal: #2B2B2B;
      --line: #dce3ee;
      --muted: #53645d;
      --slate: #31465c;
      --blue: #496f9e;
      --burgundy: #8f4e5f;
      --danger: #b94b4b;
      --shadow: 0 16px 42px rgba(0, 51, 32, .18);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--deep-text-green);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(0, 131, 80, .96), rgba(0, 51, 32, .92));
    }
    button, input, select { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 320px minmax(820px, 1fr); }
    .side {
      padding: 26px;
      background: rgba(249, 251, 249, .98);
      border-right: 1px solid var(--line);
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 30px; line-height: 1.05; }
    .tabs { display: grid; gap: 8px; margin-top: 18px; }
    .tab {
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--deep-text-green);
      display: grid;
      grid-template-columns: 13px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      font-weight: 900;
      text-align: left;
      cursor: pointer;
    }
    .tab i { width: 13px; height: 32px; border-radius: 999px; background: var(--wilmu-green); }
    .tab[aria-selected="true"] { border-color: var(--wilmu-green); outline: 3px solid rgba(0, 131, 80, .18); }
    .main { padding: 26px; overflow: auto; }
    .main-inner { min-width: 820px; display: grid; gap: 16px; }
    .header-card, .tool-card, .panel {
      background: rgba(249, 251, 249, .96);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .header-card { padding: 18px; }
    .header-card h2 { margin: 0; font-size: 28px; }
    .tool { display: none; }
    .tool.active { display: block; }
    .tool-card, .panel { padding: 16px; }
    label { display: grid; gap: 8px; font-weight: 850; color: var(--deep-text-green); }
    input[type="range"] { width: 100%; accent-color: var(--wilmu-green); }
    input[type="number"], select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fff;
      color: var(--body-charcoal);
    }
    .btn, .choice, .rule-btn, .block-btn {
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--deep-text-green);
      padding: 10px;
      font-weight: 850;
      cursor: pointer;
      text-align: left;
    }
    .active, .selected { border-color: var(--wilmu-green); background: #e7f4ee; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
    .small { font-size: 13px; color: var(--muted); }
    .result-box {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fff;
      font-weight: 950;
      min-height: 88px;
      display: grid;
      align-items: center;
