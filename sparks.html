<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayla Howsare | Law Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">KAYLA HOWSARE | CIVIL PROCEDURE SIMULATOR</div>
    <nav><a href="index.html">HOME</a></nav>
</header>

<div class="hero" style="padding: 40px 20px;">
    <h2 id="step-title">Step 1: The Complaint</h2>
    <div id="game-container">
        <p id="scenario">You are served a complaint. What is your first procedural priority under the FRCP?</p>
        <div id="choices">
            <button onclick="nextStep(1)">A) File an Answer immediately.</button><br><br>
            <button onclick="nextStep(2)">B) Determine if a Rule 12(b) Motion is applicable.</button><br><br>
        </div>
        <p id="feedback" style="margin-top:20px; font-weight:bold;"></p>
    </div>
</div>

<script>
function nextStep(choice) {
    const title = document.getElementById('step-title');
    const scenario = document.getElementById('scenario');
    const choices = document.getElementById('choices');
    const feedback = document.getElementById('feedback');

    if (choice === 2) {
        title.innerText = "Step 2: Responsive Pleading";
        scenario.innerText = "Correct. Rule 12(b) motions must be made before pleading if possible. Now that you've preserved your defenses, what's next?";
        choices.innerHTML = `
            <button onclick="finalStep(true)">A) Proceed to Discovery (Rule 26).</button><br><br>
            <button onclick="finalStep(false)">B) File an Appeal to the Supreme Court.</button>
        `;
        feedback.innerText = "";
    } else {
        feedback.innerText = "Not quite. Check Rule 12 regarding the timing of motions and waiver of defenses.";
        feedback.style.color = "red";
    }
}

function finalStep(isCorrect) {
    const scenario = document.getElementById('scenario');
    const choices = document.getElementById('choices');
    if (isCorrect) {
        scenario.innerText = "Success! You have navigated the initial procedural hurdle. Your case is now ready for the Discovery phase.";
        choices.innerHTML = "<button onclick='location.reload()'>Restart Simulation</button>";
    } else {
        alert("Final judgments are rarely appealable this early!");
    }
}
</script>
</body>
</html>
