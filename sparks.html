<body>
<header>
    <div class="logo">KAYLA HOWSARE | CIVIL PROCEDURE SIMULATOR</div>

</header>

<div class="hero" style="padding: 40px 20px;">
    <h2>Litigation Lifecycle: Rule 12(b) Juncture</h2>
    <div id="game-container">
        <p id="scenario"><strong>Scenario:</strong> You represent the defendant. The Plaintiff has just served the Complaint. What is your next procedural move under the FRCP?</p>
        
        <div id="choices">
            <button onclick="checkAnswer(false)">A) Immediately serve interrogatories (Discovery).</button><br><br>
            <button onclick="checkAnswer(true)">B) Evaluate for a Rule 12(b) Motion to Dismiss.</button><br><br>
            <button onclick="checkAnswer(false)">C) Do nothing; the Plaintiff must prove their case first.</button>
        </div>
        <p id="feedback" style="margin-top:20px; font-weight:bold;"></p>
    </div>
</div>

<script>
function checkAnswer(isCorrect) {
    const feedback = document.getElementById('feedback');
    if (isCorrect) {
        feedback.innerHTML = "Correct! Under Rule 12(b), you must raise certain defenses before filing an Answer. Discovery is premature at this stage.";
        feedback.style.color = "#008350";
    } else {
        feedback.innerHTML = "Incorrect. Refer to Rule 12(b) regarding the timing of motions and responsive pleadings.";
        feedback.style.color = "red";
    }
}
</script>
</body>
