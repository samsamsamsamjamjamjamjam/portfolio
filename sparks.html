<style>
    .timeline { display: flex; justify-content: space-between; margin: 40px 0; overflow-x: auto; gap: 5px; }
    .step { flex: 1; padding: 20px; text-align: center; color: white; cursor: pointer; transition: 0.3s; font-weight: bold; border-radius: 8px; font-size: 0.9em; }
    .step:hover { opacity: 0.9; transform: scale(1.02); }
    
    /* Color Legend: Plaintiff (Blue), Defendant (Red), Both (Purple) */
    .p-plaintiff { background-color: #3498db; }
    .p-defendant { background-color: #e74c3c; }
    .p-both { background-color: #8e44ad; }

    #info-box { padding: 20px; background: #f4f4f4; border-left: 5px solid #333; margin-top: 20px; min-height: 100px; }
</style>

<div class="timeline">
    <div class="step p-plaintiff" onclick="showInfo('Complaint')">Complaint (P)</div>
    <div class="step p-defendant" onclick="showInfo('Answer')">Answer/Motion (D)</div>
    <div class="step p-both" onclick="showInfo('Discovery')">Discovery (Both)</div>
    <div class="step p-both" onclick="showInfo('Pretrial')">Pretrial (Both)</div>
    <div class="step p-both" onclick="showInfo('Trial')">Trial (Both)</div>
    <div class="step p-both" onclick="showInfo('Appeal')">Appeal (Both)</div>
</div>

<div id="info-box"><h3>Click a phase to learn more.</h3></div>

<script>
function showInfo(phase) {
    const info = {
        'Complaint': '<strong>Plaintiff:</strong> Files the complaint to initiate the action.',
        'Answer': '<strong>Defendant:</strong> Files an answer, asserts defenses, or moves to dismiss.',
        'Discovery': '<strong>Both Parties:</strong> Investigate facts, take discovery, file and argue motions.',
        'Pretrial': '<strong>Both Parties:</strong> Pretrial conference, possible motions for summary judgment or on evidentiary issues.',
        'Trial': '<strong>Both Parties:</strong> Opening/closing statements, evidence, jury instructions, deliberation, and verdict.',
        'Appeal': '<strong>Both Parties:</strong> Losing party may appeal errors of law to a higher court.'
    };
    document.getElementById('info-box').innerHTML = `<h3>${phase} Phase</h3><p>${info[phase]}</p>`;
}
</script>
