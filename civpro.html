<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Civil Procedure Interactive Flowcharts</title>
  <style>
    :root {
      --wilmu-green: #008350;
      --deep-text-green: #003320;
      --canvas-white: #F9FBF9;
      --body-charcoal: #2B2B2B;
      --ink: var(--deep-text-green);
      --muted: #52635c;
      --line: #dce3ee;
      --page: var(--canvas-white);
      --school-green: var(--wilmu-green);
      --card: var(--canvas-white);
      --topic: var(--wilmu-green);
      --good: #23865a;
      --bad: #c2413a;
      --shadow: 0 16px 42px rgba(21, 32, 51, .13);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--deep-text-green);
      background: var(--page);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(0, 131, 80, .96), rgba(0, 51, 32, .92)),
        var(--school-green);
    }

    button { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 318px minmax(760px, 1fr);
    }

    .side {
      min-height: 100vh;
      padding: 24px;
      background: rgba(249,251,249,.92);
      border-right: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      font-size: 27px;
      line-height: 1.08;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: 0;
      margin-bottom: 10px;
    }

    h3 {
      font-size: 16px;
      letter-spacing: 0;
      margin-bottom: 8px;
    }

    p, .small {
      color: var(--muted);
      line-height: 1.5;
    }

    .small { font-size: 13px; }

    .tabs {
      display: grid;
      gap: 8px;
      margin: 22px 0;
    }

    .tab {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      padding: 10px 12px;
      text-align: left;
      display: grid;
      grid-template-columns: 13px 1fr;
      gap: 10px;
      align-items: center;
      box-shadow: 0 8px 18px rgba(21, 32, 51, .06);
    }

    .tab i {
      width: 13px;
      height: 30px;
      border-radius: 999px;
      background: var(--tab-color);
    }

    .tab[aria-selected="true"] {
      border-color: var(--tab-color);
      outline: 3px solid color-mix(in srgb, var(--tab-color) 22%, transparent);
      font-weight: 900;
    }

    .actions {
      display: grid;
      gap: 9px;
      margin-top: 18px;
    }

    .btn, .choice {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--canvas-white);
      color: var(--ink);
      cursor: pointer;
      font-weight: 900;
    }

    .btn {
      min-height: 42px;
      padding: 9px 12px;
    }

    .btn.primary {
      background: var(--topic);
      border-color: var(--topic);
      color: #fff;
    }

    .main {
      padding: 28px;
      overflow-x: auto;
    }

    .main-inner {
      max-width: 1120px;
      min-width: 760px;
    }

    .top {
      margin-bottom: 18px;
    }

    .definition, .calm-card {
      background: rgba(249,251,249,.94);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 10px 26px rgba(21, 32, 51, .07);
      padding: 16px;
    }

    .definition {
      border-left: 8px solid var(--topic);
    }

    .progress {
      height: 12px;
      border-radius: 999px;
      background: #e8edf5;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-fill {
      height: 100%;
      width: var(--progress);
      background: linear-gradient(90deg, var(--topic), color-mix(in srgb, var(--topic) 55%, #fff));
      border-radius: 999px;
      transition: width .18s ease;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: start;
    }

    .pathway {
      display: grid;
      gap: 14px;
    }

    .step {
      position: relative;
      background: rgba(249,251,249,.97);
      border: 2px solid var(--line);
      border-left: 9px solid var(--topic);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
      animation: rise .16s ease-out;
    }

    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 42px;
      bottom: -18px;
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--topic) 48%, var(--line));
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .step-number {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: var(--topic);
      color: #fff;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .question {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 950;
      margin-bottom: 8px;
    }

    .explain {
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 14px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .choice {
      min-height: 56px;
      padding: 11px 12px;
      text-align: left;
      border-width: 2px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    .choice:hover {
      transform: translateY(-1px);
      border-color: var(--topic);
    }

    .choice.selected {
      border-color: var(--topic);
      background: color-mix(in srgb, var(--topic) 12%, var(--canvas-white));
    }

    .choice span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 3px;
      line-height: 1.35;
      font-weight: 700;
    }

    .result {
      background: linear-gradient(135deg, color-mix(in srgb, var(--topic) 13%, var(--canvas-white)), var(--canvas-white));
      border-color: color-mix(in srgb, var(--topic) 45%, var(--line));
    }

    .result .question {
      color: color-mix(in srgb, var(--topic) 72%, var(--ink));
    }

    .right {
      display: grid;
      gap: 14px;
      position: sticky;
      top: 20px;
    }

    .panel {
      background: rgba(249,251,249,.95);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(21, 32, 51, .08);
    }

    .mini-path {
      display: grid;
      gap: 8px;
    }

    .mini-path div {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .mini-path b {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: var(--topic);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
    }

    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 5px 9px;
      background: color-mix(in srgb, var(--topic) 12%, var(--canvas-white));
      border: 1px solid color-mix(in srgb, var(--topic) 32%, var(--line));
      font-size: 12px;
      font-weight: 900;
      margin-top: 4px;
    }

    .feedback {
      min-height: 60px;
      color: var(--muted);
      line-height: 1.45;
      margin-top: 10px;
      font-size: 13px;
    }

    .good {
      border-color: rgba(35, 134, 90, .6) !important;
      background: rgba(35, 134, 90, .12) !important;
    }

    .bad {
      border-color: rgba(194, 65, 58, .6) !important;
      background: rgba(194, 65, 58, .12) !important;
    }

    @media (max-width: 980px) {
      .app { grid-template-columns: 1fr; }
      .side { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .main-inner { min-width: 0; }
      .top, .workspace { grid-template-columns: 1fr; }
      .right { position: static; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <h1>Civil Procedure Interactive Flowcharts</h1>
      <p>Click the concept!</p>
      <nav class="tabs" id="tabs"></nav>
      <div class="actions">
        <button class="btn primary" id="restart">Restart this flowchart</button>
        <button class="btn" id="copy">Copy current result</button>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <section class="top">
          <div class="definition">
            <h2 id="title"></h2>
            <div class="progress" aria-label="Progress through this flowchart">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </section>

        <section class="workspace">
          <div class="pathway" id="pathway"></div>

          <aside class="right"></aside>
        </section>
      </div>
    </main>
  </div>

  <script>
    const flows = {
      hanna: {
        title: "Hanna I or Hanna II?",
        color: "#2563eb",
        goal: "Students learn which Erie/Hanna path applies before they write the rule.",
        definition: "This test determines whether state or federal law applies in a federal diversity case when a state law conflicts with a federal procedural rule, practice, or policy.",
        start: "stateClaim",
        nodes: {
          stateClaim: q("Is the federal court deciding a state-law claim, usually through diversity jurisdiction?", "Erie/Hanna usually matters when a federal court handles state-created rights.", [
            a("Yes", "conflict", "Move to the conflict question."),
            a("No", "notErie", "This is probably not a Hanna problem.")
          ]),
          conflict: q("Is there a real conflict between state law and a federal rule, statute, constitutional provision, or federal practice?", "Name both rules. Do not say 'state versus federal' without identifying the actual conflict.", [
            a("Yes", "directRule", "Now decide whether a federal rule directly controls."),
            a("No", "noConflict", "If both can operate together, no hard Erie/Hanna problem.")
          ]),
          directRule: q("Is a Federal Rule of Civil Procedure, federal statute, or constitutional provision directly on point?", "This question decides the track.", [
            a("Yes", "validRule", "Use Hanna II."),
            a("No", "twinEvils", "Use Hanna I.")
          ]),
          validRule: q("Is the federal rule valid under the Rules Enabling Act and the Constitution?", "Ask whether it regulates practice or procedure and does not alter substantive rights.", [
            a("Yes", "hannaII", "The valid federal rule controls."),
            a("No", "stateLaw", "An invalid federal rule cannot displace state law.")
          ]),
          twinEvils: q("Would using the federal practice encourage forum shopping or inequitable administration of the laws?", "These are Erie’s twin evils.", [
            a("Yes", "stateLaw", "State law likely controls."),
            a("No", "hannaI", "Federal practice likely controls.")
          ]),
          hannaII: r("Use Hanna II.", "A valid Federal Rule, federal statute, or constitutional provision directly on point usually controls over conflicting state law."),
          hannaI: r("Use Hanna I.", "When no Federal Rule directly controls, ask whether federal practice would cause forum shopping or inequitable administration. If not, federal practice may be used."),
          stateLaw: r("Apply state law.", "State law controls when the federal approach would create Erie’s twin evils, or when the federal rule is not valid."),
          noConflict: r("No major Hanna problem.", "If there is no real conflict, say so and apply the rules that can coexist."),
          notErie: r("This is probably not the right flowchart.", "If the claim arises under federal law, start with federal question, FRCP, or the relevant federal statute instead.")
        }
      },
      availment: {
        title: "Purposeful Availment Test",
        color: "#0f9f8f",
        goal: "Students learn specific personal jurisdiction without mixing it up with general jurisdiction.",
        definition: "This test determines whether a nonresident defendant purposefully directed activities at the forum state, creating minimum contacts for specific personal jurisdiction.",
        start: "defendantContact",
        nodes: {
          defendantContact: q("Did the defendant create a contact with the forum state?", "The contact must come from the defendant, not just from the plaintiff moving or carrying something into the forum.", [
            a("Yes", "purposeful", "Continue to purposeful availment."),
            a("No", "noPJ", "No defendant-created contact is a serious problem.")
          ]),
          purposeful: q("Did the defendant purposefully avail itself of the forum or purposefully direct conduct there?", "Look for targeting, contracts, repeated business, marketing, or a continuing relationship.", [
            a("Yes", "related", "Move to relatedness."),
            a("No", "noPJ", "No purposeful availment means specific PJ likely fails.")
          ]),
          related: q("Does the plaintiff’s claim arise out of or relate to the defendant’s forum contacts?", "Ford allows a relatedness argument even without strict but-for causation.", [
            a("Yes", "fairness", "Move to fairness."),
            a("No", "noPJ", "Unrelated contacts do not support specific PJ.")
          ]),
          fairness: q("Would exercising jurisdiction be fair and reasonable?", "Use burden on defendant, forum interest, plaintiff interest, efficiency, and shared policy interests.", [
            a("Yes", "pjLikely", "Specific PJ likely exists."),
            a("No", "pjFailsFairness", "Fairness may defeat jurisdiction.")
          ]),
          pjLikely: r("Specific personal jurisdiction likely exists.", "Write the chain: defendant-created contact, purposeful availment, relatedness, and fairness."),
          pjMaybe: r("Specific personal jurisdiction is arguable.", "This is a close case. The strongest analysis should focus on purposeful availment, relatedness, and the fairness factors."),
          pjFailsFairness: r("Personal jurisdiction may fail on fairness.", "Even with contacts, severe burden or weak forum interests can make jurisdiction unreasonable."),
          noPJ: r("Specific personal jurisdiction likely fails.", "Identify the missing piece: defendant-created contact, purposeful availment, relatedness, or fairness.")
        }
      },
      grable: {
        title: "Grable Test",
        color: "#f26d5b",
        goal: "Students learn why embedded federal issue jurisdiction is rare.",
        definition: "This test determines whether a state-law claim contains a federal issue substantial and disputed enough to trigger federal question jurisdiction.",
        start: "stateClaim",
        nodes: {
          stateClaim: q("Is the plaintiff bringing a state-law claim rather than a federal cause of action?", "If federal law creates the cause of action, you usually do not need Grable.", [
            a("Yes", "necessary", "Check the embedded federal issue."),
            a("No", "ordinaryFQ", "Use ordinary federal question jurisdiction.")
          ]),
          necessary: q("Is the federal issue necessarily raised by the state-law claim?", "The court must need to decide the federal issue to resolve the state claim.", [
            a("Yes", "disputed", "Move to actual dispute."),
            a("No", "noGrable", "Grable fails.")
          ]),
          disputed: q("Is the federal issue actually disputed by the parties?", "A federal issue no one contests does not support Grable well.", [
            a("Yes", "substantial", "Move to substantiality."),
            a("No", "noGrable", "Grable fails.")
          ]),
          substantial: q("Is the federal issue substantial to the federal system as a whole?", "It must matter beyond just these parties.", [
            a("Yes", "balance", "Move to federal-state balance."),
            a("No", "noGrable", "Grable fails.")
          ]),
          balance: q("Can federal court hear this kind of issue without disrupting the federal-state balance approved by Congress?", "This prevents ordinary state cases from flooding federal court.", [
            a("Yes", "grableYes", "Grable jurisdiction may exist."),
            a("No", "noGrable", "Grable fails.")
          ]),
          ordinaryFQ: r("Use ordinary federal question jurisdiction.", "If federal law creates the cause of action, the Holmes test usually supports federal question jurisdiction."),
          grableYes: r("Grable jurisdiction may exist.", "All four requirements are met: necessarily raised, actually disputed, substantial, and compatible with federal-state balance."),
          noGrable: r("Grable jurisdiction likely fails.", "Most state-law claims with federal ingredients still belong in state court unless all Grable requirements are satisfied.")
        }
      },
      venue: {
        title: "Venue Analysis",
        color: "#f6b73c",
        goal: "Students learn which district is proper without confusing venue with jurisdiction.",
        definition: "This analysis determines which specific federal district court is the proper and statutorily permissible geographic location to hear a lawsuit.",
        start: "removed",
        nodes: {
          removed: q("Was the case removed from state court to federal court?", "Removal has its own venue rule.", [
            a("Yes", "removalVenue", "Use the district embracing the state court."),
            a("No", "sameState", "Use the ordinary venue statute.")
          ]),
          removalVenue: r("Use the federal district embracing the state court.", "For removal, the case goes to the federal district that geographically contains the state court. Ordinary venue selection does not control."),
          sameState: q("Do all defendants reside in the same state?", "This matters for § 1391(b)(1).", [
            a("Yes", "defendantDistrict", "Check defendant residence venue."),
            a("No", "events", "Move to substantial events.")
          ]),
          defendantDistrict: q("Is the chosen district one where any defendant resides?", "If all defendants are in the same state, venue is proper in a district where any defendant resides.", [
            a("Yes", "venueProper", "Venue is proper under § 1391(b)(1)."),
            a("No", "events", "Try substantial events.")
          ]),
          events: q("Did a substantial part of the events, omissions, or property giving rise to the claim occur in this district?", "Look at the whole sequence of events, not just the final injury.", [
            a("Yes", "venueProper", "Venue is proper under § 1391(b)(2)."),
            a("No", "fallback", "Try fallback venue.")
          ]),
          fallback: q("Is there no other district where the action may otherwise be brought?", "Fallback venue is rare.", [
            a("Yes", "fallbackProper", "Use § 1391(b)(3)."),
            a("No", "venueImproper", "Venue is improper.")
          ]),
          venueProper: q("Venue is proper. Should the court still transfer for convenience?", "Proper venue can still be transferred under § 1404.", [
            a("Yes", "transfer1404", "Analyze convenience and interests of justice."),
            a("No", "keepVenue", "Keep the case in this district.")
          ]),
          fallbackProper: r("Venue is proper under the fallback rule.", "If no district qualifies under § 1391(b)(1) or (b)(2), venue may be proper where a defendant is subject to personal jurisdiction."),
          venueImproper: r("Venue is improper.", "The court may dismiss or transfer under § 1406."),
          transfer1404: r("Analyze transfer under § 1404.", "Because venue is proper, transfer depends on convenience of parties and witnesses and the interests of justice."),
          keepVenue: r("Venue stays in this district.", "If venue is proper and transfer is not justified, the case remains where filed.")
        }
      },
      impleader: {
        title: "Impleader Analysis",
        color: "#31a66a",
        goal: "Students learn that Rule 14 is about derivative liability, not just adding another related party.",
        definition: "This analysis determines whether a defending party can bring in a third-party defendant who may be liable for all or part of the claim against the defending party.",
        start: "defendingParty",
        nodes: {
          defendingParty: q("Is the party trying to add someone already defending against a claim?", "Rule 14 usually lets a defendant become a third-party plaintiff.", [
            a("Yes", "derivative", "Check derivative liability."),
            a("No", "notRule14", "Rule 14 may not be the correct joinder rule.")
          ]),
          derivative: q("Is the proposed third-party defendant potentially liable to the defending party for all or part of the plaintiff’s claim?", "Think indemnity, contribution, or reimbursement.", [
            a("Yes", "directVsDerivative", "Continue."),
            a("No", "notRule14", "Not proper impleader.")
          ]),
          directVsDerivative: q("Is the defending party trying to pass liability along, rather than merely saying someone else is liable to the plaintiff?", "Rule 14 requires derivative liability.", [
            a("Yes", "timing", "Check timing."),
            a("No", "notRule14", "This is not impleader.")
          ]),
          timing: q("Was the third-party complaint filed within 14 days after serving the answer?", "After 14 days, the party needs leave of court.", [
            a("Yes", "jurisdiction", "Check jurisdiction."),
            a("No", "leaveCourt", "Need court permission.")
          ]),
          leaveCourt: q("Did the court grant permission to implead the third-party defendant?", "Courts consider delay, prejudice, and efficiency.", [
            a("Yes", "jurisdiction", "Check jurisdiction."),
            a("No", "notAllowed", "Impleader not allowed.")
          ]),
          jurisdiction: q("Does the court have subject matter jurisdiction, personal jurisdiction, and proper service for the third-party defendant?", "Rule 14 does not create jurisdiction by itself.", [
            a("Yes", "impleaderAllowed", "Impleader likely allowed."),
            a("No", "notAllowed", "Jurisdiction/service problem.")
          ]),
          impleaderAllowed: r("Impleader is likely allowed.", "The defending party may bring in a third-party defendant whose liability is derivative of the defending party’s liability to the plaintiff."),
          notRule14: r("Rule 14 likely does not apply.", "Use another joinder rule if the claim is direct, independent, or not about passing liability along."),
          notAllowed: r("Impleader is not allowed on these facts.", "The problem is timing, court permission, jurisdiction, service, or lack of derivative liability.")
        }
      },
      diversity: {
        title: "Diversity Jurisdiction",
        color: "#263b63",
        goal: "Students learn complete diversity by comparing every plaintiff to every defendant.",
        definition: "This analysis determines whether a federal court has subject-matter jurisdiction based on complete diversity of citizenship and an amount in controversy exceeding $75,000.",
        start: "citizenshipKnown",
        nodes: {
          citizenshipKnown: q("Can you identify the citizenship of every plaintiff and every defendant at the time the case was filed?", "Diversity is measured at filing.", [
            a("Yes", "complete", "Compare every side."),
            a("No", "determineCitizenship", "Figure out citizenship first.")
          ]),
          determineCitizenship: q("Are you dealing with individuals, corporations, or both?", "Individuals and corporations have different citizenship tests.", [
            a("Individuals", "individuals", "Use domicile."),
            a("Corporations", "corporations", "Use both corporate citizenships."),
            a("Both", "complete", "Apply both tests, then compare.")
          ]),
          individuals: q("For each individual, do you know their domicile?", "Domicile means residence plus intent to remain indefinitely.", [
            a("Yes", "complete", "Compare citizenships."),
            a("No", "noDiversityYet", "You need more facts.")
          ]),
          corporations: q("For each corporation, do you know both its state of incorporation and principal place of business?", "A corporation is a citizen of both.", [
            a("Yes", "complete", "Compare citizenships."),
            a("No", "noDiversityYet", "You need more facts.")
          ]),
          complete: q("Does any plaintiff share citizenship with any defendant?", "Complete diversity fails if even one plaintiff overlaps with one defendant.", [
            a("Yes", "noComplete", "No complete diversity."),
            a("No", "amount", "Check amount in controversy.")
          ]),
          amount: q("Does the amount in controversy exceed $75,000?", "Use the plaintiff’s good-faith claim unless it is legally certain the amount is too low.", [
            a("Yes", "diversityYes", "Diversity jurisdiction likely exists."),
            a("No", "amountNo", "Diversity jurisdiction fails.")
          ]),
          diversityYes: r("Diversity jurisdiction likely exists.", "There is complete diversity and the amount in controversy exceeds $75,000."),
          noComplete: r("No complete diversity.", "Federal diversity jurisdiction fails because at least one plaintiff shares citizenship with at least one defendant."),
          amountNo: r("No diversity jurisdiction.", "Even with complete diversity, the amount in controversy must exceed $75,000."),
          noDiversityYet: r("More citizenship facts are needed.", "Do not guess. Identify domicile for individuals and both corporate citizenships for corporations.")
        }
      },
      erie: {
        title: "Erie Doctrine Analysis",
        color: "#7c3aed",
        goal: "Students learn the bigger Erie frame before choosing Hanna I or Hanna II.",
        definition: "This analysis determines whether a federal court sitting in diversity should apply state substantive law or federal procedural law.",
        start: "federalState",
        nodes: {
          federalState: q("Is a federal court deciding a state-law claim?", "Erie is about federal courts applying state-created rights.", [
            a("Yes", "choiceLaw", "Continue."),
            a("No", "notErie", "Probably not Erie.")
          ]),
          choiceLaw: q("Has the court identified which state’s law applies using the forum state’s choice-of-law rules?", "Klaxon says a federal diversity court uses the choice-of-law rules of the state where it sits.", [
            a("Yes", "substantive", "Continue."),
            a("No", "klaxon", "Apply Klaxon first.")
          ]),
          klaxon: q("After applying the forum state’s choice-of-law rules, do you know which state’s law applies?", "This is horizontal choice of law before vertical Erie analysis.", [
            a("Yes", "substantive", "Continue."),
            a("No", "needChoiceLaw", "Need more choice-of-law analysis.")
          ]),
          substantive: q("Is the disputed issue clearly substantive, such as an element, defense, damages rule, or statute of limitations?", "Federal courts apply state substantive law in diversity.", [
            a("Yes", "stateSubstantive", "Apply state law."),
            a("No", "federalProcedure", "Check whether it is procedural or mixed.")
          ]),
          federalProcedure: q("Is there a Federal Rule or federal practice that conflicts with state law?", "This sends you to Hanna.", [
            a("Yes", "hannaChoice", "Use the Hanna branch."),
            a("No", "noConflict", "No hard Erie problem.")
          ]),
          hannaChoice: q("Is a Federal Rule of Civil Procedure directly on point?", "A Federal Rule sends the analysis to Hanna II. A federal practice without a Federal Rule sends it to Hanna I.", [
            a("Yes", "hannaII", "Use Hanna II."),
            a("No", "hannaI", "Use Hanna I.")
          ]),
          stateSubstantive: r("Apply state substantive law.", "In diversity, federal courts apply state substantive law, including state common law and the forum state’s choice-of-law rules."),
          hannaII: r("Use Hanna II.", "If a valid Federal Rule directly controls, it usually governs over conflicting state law."),
          hannaI: r("Use Hanna I.", "If only federal practice conflicts with state law, ask whether using federal practice causes forum shopping or inequitable administration."),
          noConflict: r("No hard Erie problem.", "If state law and federal procedure can coexist, apply both without forcing a conflict."),
          notErie: r("Erie probably is not the main issue.", "For federal claims, start with federal law, the FRCP, and any governing federal statute."),
          needChoiceLaw: r("More choice-of-law analysis is needed.", "Do not apply a state rule until you know which state’s rule the federal court should use.")
        }
      }
    };

    const order = ["hanna", "availment", "grable", "venue", "impleader", "diversity", "erie"];
    let active = "hanna";
    let paths = {};

    function q(question, help, choices) {
      return { type: "question", question, help, choices };
    }

    function a(label, next, hint) {
      return { label, next, hint };
    }

    function r(title, text) {
      return { type: "result", title, text };
    }

    function init() {
      order.forEach(key => paths[key] = [{ id: flows[key].start, answer: null }]);
      renderTabs();
      render();
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML = order.map(key => {
        const flow = flows[key];
        return `<button class="tab" style="--tab-color:${flow.color}" data-tab="${key}" aria-selected="${key === active}"><i></i><span>${flow.title}</span></button>`;
      }).join("");
      document.querySelectorAll("[data-tab]").forEach(tab => {
        tab.addEventListener("click", () => {
          active = tab.dataset.tab;
          renderTabs();
          render();
        });
      });
    }

    function render() {
      const flow = flows[active];
      document.documentElement.style.setProperty("--topic", flow.color);
      document.getElementById("title").textContent = flow.title;
      renderPathway(flow);
      updateProgress(flow);
    }

    function renderPathway(flow) {
      const pathway = document.getElementById("pathway");
      const path = paths[active];
      pathway.innerHTML = path.map((entry, index) => {
        const node = flow.nodes[entry.id];
        if (node.type === "result") {
          return `<article class="step result" id="step-${index}">
            <div class="step-head"><span class="step-number">✓</span><span class="small">Result</span></div>
            <div class="question">${node.title}</div>
            <div class="explain">${node.text}</div>
          </article>`;
        }
        const choices = node.choices.map(choice => {
          const selected = entry.answer === choice.label ? " selected" : "";
          return `<button class="choice${selected}" data-step="${index}" data-next="${choice.next}" data-label="${choice.label}">
            ${choice.label}
          </button>`;
        }).join("");
        return `<article class="step" id="step-${index}">
          <div class="step-head"><span class="step-number">${index + 1}</span><span class="small">Question ${index + 1}</span></div>
          <div class="question">${node.question}</div>
          <div class="choices">${choices}</div>
        </article>`;
      }).join("");
      pathway.querySelectorAll(".choice").forEach(button => {
        button.addEventListener("click", () => choose(Number(button.dataset.step), button.dataset.label, button.dataset.next));
      });
    }

    function choose(stepIndex, label, next) {
      const current = paths[active].slice(0, stepIndex + 1);
      current[stepIndex] = { ...current[stepIndex], answer: label };
      current.push({ id: next, answer: null });
      paths[active] = current;
      render();
      setTimeout(() => {
        const el = document.getElementById(`step-${stepIndex + 1}`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 30);
    }

    function updateProgress(flow) {
      const path = paths[active];
      const hasResult = flow.nodes[path[path.length - 1].id].type === "result";
      const pct = hasResult ? 100 : Math.min(92, 18 + path.length * 13);
      document.getElementById("progressFill").style.setProperty("--progress", pct + "%");
    }

    document.getElementById("restart").addEventListener("click", () => {
      paths[active] = [{ id: flows[active].start, answer: null }];
      render();
    });

    document.getElementById("copy").addEventListener("click", async () => {
      const last = paths[active][paths[active].length - 1];
      const node = flows[active].nodes[last.id];
      const text = node.type === "result" ? `${node.title}\n\n${node.text}` : node.question;
      await navigator.clipboard.writeText(text);
      document.getElementById("copy").textContent = "Copied";
      setTimeout(() => document.getElementById("copy").textContent = "Copy current result", 1000);
    });

    init();
  </script>
</body>
</html>
