<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contracts Interactive Flowcharts</title>
  <style>
    :root {
      --wilmu-green: #008350;
      --deep-text-green: #003320;
      --canvas-white: #F9FBF9;
      --body-charcoal: #2B2B2B;
      --line: #dce3ee;
      --muted: #53645d;
      --topic: var(--wilmu-green);
      --shadow: 0 16px 42px rgba(0, 51, 32, .18);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--deep-text-green);
      background: var(--canvas-white);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, rgba(0, 131, 80, .96), rgba(0, 51, 32, .92));
    }
    button { font: inherit; }
    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 310px minmax(760px, 1fr);
    }
    .side {
      min-height: 100vh;
      padding: 24px;
      background: rgba(249, 251, 249, .94);
      border-right: 1px solid var(--line);
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      font-size: 28px;
      line-height: 1.08;
      letter-spacing: 0;
      margin-bottom: 8px;
    }
    h2 {
      font-size: 34px;
      line-height: 1.1;
      letter-spacing: 0;
      margin-bottom: 10px;
    }
    h3 {
      font-size: 16px;
      letter-spacing: 0;
      margin-bottom: 8px;
    }
    p, .small {
      color: var(--muted);
      line-height: 1.5;
    }
    .small { font-size: 13px; }
    .tabs {
      display: grid;
      gap: 8px;
    }
    .tab {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--canvas-white);
      color: var(--deep-text-green);
      padding: 10px 12px;
      text-align: left;
      display: grid;
      grid-template-columns: 13px 1fr;
      gap: 10px;
      align-items: center;
      box-shadow: 0 8px 18px rgba(0, 51, 32, .08);
      font-weight: 900;
      cursor: pointer;
    }
    .tab i {
      width: 13px;
      height: 30px;
      border-radius: 999px;
      background: var(--topic);
    }
    .tab[aria-selected="true"] {
      border-color: var(--topic);
      outline: 3px solid rgba(0, 131, 80, .18);
    }
    .actions {
      display: grid;
      gap: 9px;
      margin-top: 18px;
    }
    .aardvark-wrap {
      margin-top: 18px;
      display: grid;
      justify-items: center;
      gap: 6px;
    }
    .aardvark {
      width: 138px;
      height: 106px;
      object-fit: contain;
      animation: aardvark-bounce 1.8s ease-in-out infinite;
      transform-origin: 50% 90%;
    }
    .aardvark-shadow {
      width: 84px;
      height: 12px;
      border-radius: 999px;
      background: rgba(0, 51, 32, .18);
      animation: aardvark-shadow 1.8s ease-in-out infinite;
    }
    .cartoon-link {
      width: 100%;
      display: block;
      margin-top: 8px;
      padding: 10px 12px;
      border: 2px solid var(--wilmu-green);
      border-radius: 8px;
      background: #e7f4ee;
      color: var(--deep-text-green);
      font-weight: 900;
      text-align: center;
      text-decoration: none;
    }
    .cartoon-link:hover {
      background: #d7eee3;
    }
    @keyframes aardvark-bounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      45% { transform: translateY(-10px) rotate(2deg); }
      60% { transform: translateY(-7px) rotate(-2deg); }
    }
    @keyframes aardvark-shadow {
      0%, 100% { transform: scaleX(1); opacity: .18; }
      45% { transform: scaleX(.78); opacity: .1; }
      60% { transform: scaleX(.86); opacity: .13; }
    }
    .btn, .choice {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--canvas-white);
      color: var(--deep-text-green);
      cursor: pointer;
      font-weight: 900;
    }
    .btn {
      min-height: 42px;
      padding: 9px 12px;
    }
    .btn.primary {
      background: var(--topic);
      border-color: var(--topic);
      color: #fff;
    }
    .main {
      padding: 28px;
      overflow-x: auto;
    }
    .main-inner {
      max-width: 1040px;
      min-width: 720px;
    }
    .top { margin-bottom: 18px; }
    .header-card {
      background: rgba(249, 251, 249, .95);
      border: 1px solid var(--line);
      border-left: 8px solid var(--topic);
      border-radius: 8px;
      box-shadow: 0 10px 26px rgba(0, 51, 32, .12);
      padding: 16px;
    }
    .progress {
      height: 12px;
      border-radius: 999px;
      background: #e8eee9;
      overflow: hidden;
      margin-top: 12px;
    }
    .progress-fill {
      height: 100%;
      width: var(--progress);
      background: linear-gradient(90deg, var(--topic), #44b987);
      border-radius: 999px;
      transition: width .18s ease;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 18px;
      align-items: start;
    }
    .pathway {
      display: grid;
      gap: 14px;
    }
    .reference {
      position: sticky;
      top: 20px;
      display: grid;
      gap: 10px;
    }
    .ref-card {
      background: rgba(249, 251, 249, .96);
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 13px;
      box-shadow: 0 10px 24px rgba(0, 51, 32, .1);
      opacity: .68;
    }
    .ref-card.active {
      opacity: 1;
      border-color: var(--topic);
      box-shadow: 0 14px 30px rgba(0, 131, 80, .2);
    }
    .ref-card strong {
      display: block;
      color: var(--deep-text-green);
      margin-bottom: 5px;
    }
    .ref-card p {
      margin-bottom: 0;
      font-size: 13px;
    }
    .step {
      position: relative;
      background: rgba(249, 251, 249, .98);
      border: 2px solid var(--line);
      border-left: 9px solid var(--topic);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
      animation: rise .16s ease-out;
    }
    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      left: 42px;
      bottom: -18px;
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: rgba(0, 131, 80, .45);
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .step-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }
    .step-number {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 999px;
      background: var(--topic);
      color: #fff;
      font-weight: 900;
      flex: 0 0 auto;
    }
    .question {
      font-size: 22px;
      line-height: 1.25;
      font-weight: 950;
      margin-bottom: 14px;
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .choice {
      min-height: 56px;
      padding: 11px 12px;
      text-align: center;
      border-width: 2px;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .choice:hover {
      transform: translateY(-1px);
      border-color: var(--topic);
    }
    .choice.selected {
      border-color: var(--topic);
      background: color-mix(in srgb, var(--topic) 12%, var(--canvas-white));
    }
    .result {
      background: linear-gradient(135deg, color-mix(in srgb, var(--topic) 13%, var(--canvas-white)), var(--canvas-white));
      border-color: color-mix(in srgb, var(--topic) 45%, var(--line));
    }
    .result-text {
      color: var(--body-charcoal);
      line-height: 1.55;
      font-size: 16px;
    }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .side { min-height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      .main-inner { min-width: 0; }
      .workspace { grid-template-columns: 1fr; }
      .reference { position: static; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <h1>Contracts Interactive Flowcharts</h1>
      <p>Click the concept!</p>
      <nav class="tabs" id="tabs"></nav>
      <div class="actions">
        <button class="btn primary" id="restart">Restart this flowchart</button>
        <button class="btn" id="copy">Copy current result</button>
      </div>
      <div class="aardvark-wrap" aria-label="Goofy aardvark easter egg">
        <img class="aardvark" src="aardvark.png" alt="Goofy bouncing aardvark">
        <div class="aardvark-shadow"></div>
        <a class="cartoon-link" href="https://docs.google.com/document/d/1eieOd-8V7JtXAYkEqFYJ-ClCZvPNggrTuMfeyi8A4vo/edit?usp=sharing" target="_blank" rel="noopener">Course Cartoons</a>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <section class="top">
          <div class="header-card">
            <h2 id="title"></h2>
            <div class="progress" aria-label="Progress through this flowchart">
              <div class="progress-fill" id="progressFill"></div>
            </div>
          </div>
        </section>

        <section class="workspace">
          <div class="pathway" id="pathway"></div>
          <aside class="reference" id="reference"></aside>
        </section>
      </div>
    </main>
  </div>

  <script>
    const flows = {
      forms: {
        title: "Battle of the Forms",
        start: "contractExists",
        refs: [
          ["one", "UCC 2-207(1)", "Definite and seasonable acceptance can form a contract even with additional or different terms, unless acceptance is expressly conditional."],
          ["two", "UCC 2-207(2)", "Additional terms between merchants become part of the contract unless the offer limits acceptance, the term materially alters, or the offeror objects."],
          ["three", "UCC 2-207(3)", "If writings do not form a contract but conduct shows agreement, terms are agreed-upon terms plus UCC gap fillers."]
        ],
        refMap: {
          contractExists: "one",
          conditional: "one",
          terms: "two",
          exceptions: "two",
          termsIn: "two",
          termsOut: "two",
          proposals: "two",
          conduct: "three",
          conductContract: "three",
          noContract: "three"
        },
        nodes: {
          contractExists: q("Is there a definite and seasonable expression of acceptance?", [
            a("Yes", "conditional"),
            a("No", "conduct")
          ]),
          conditional: q("Is the acceptance expressly conditional on assent to the new terms?", [
            a("Yes", "conduct"),
            a("No", "terms")
          ]),
          terms: q("Are the new terms additional terms between merchants?", [
            a("Yes", "exceptions"),
            a("No", "proposals")
          ]),
          exceptions: q("Does the offer limit acceptance to its own terms, would the new term materially alter the contract, or did the offeror object in a reasonable time?", [
            a("Yes", "termsOut"),
            a("No", "termsIn")
          ]),
          conduct: q("Did the parties behave as if a contract exists?", [
            a("Yes", "conductContract"),
            a("No", "noContract")
          ]),
          termsIn: r("The additional terms become part of the contract.", "Under UCC 2-207(2), additional terms between merchants become part of the contract unless one of the listed exceptions applies."),
          termsOut: r("The additional terms do not become part of the contract.", "Under UCC 2-207(2), the additional terms are excluded if the offer limits acceptance, the term materially alters the contract, or the offeror objects in a reasonable time."),
          proposals: r("The new terms are treated as proposals.", "If the terms are not additional terms between merchants, they do not automatically become part of the contract under UCC 2-207(2)."),
          conductContract: r("A contract is formed by conduct.", "Under UCC 2-207(3), if the writings do not form a contract but the parties behave as if one exists, the contract terms are the agreed-upon terms plus UCC gap fillers."),
          noContract: r("No contract is formed under this framework.", "If there is no definite acceptance and the parties do not behave as if a contract exists, UCC 2-207 does not create a contract.")
        }
      },
      estoppel: {
        title: "Promissory Estoppel",
        start: "promise",
        refs: [
          ["promise", "Promise", "The promisor made a promise clear enough that the promisee could reasonably understand a commitment was being made."],
          ["foreseeable", "Foreseeable Reliance", "The promisor should reasonably expect the promise to induce action or forbearance."],
          ["reliance", "Actual Reliance", "The promisee actually relied on the promise by acting or refraining from acting."],
          ["injustice", "Injustice", "Enforcement is necessary to avoid injustice. The remedy may be limited as justice requires."]
        ],
        refMap: {
          promise: "promise",
          foreseeable: "foreseeable",
          actual: "reliance",
          reasonable: "reliance",
          injustice: "injustice",
          enforce: "injustice",
          failPromise: "promise",
          failForeseeable: "foreseeable",
          failReliance: "reliance",
          failReasonable: "reliance",
          failInjustice: "injustice"
        },
        nodes: {
          promise: q("Did the promisor make a clear promise?", [
            a("Yes", "foreseeable"),
            a("No", "failPromise")
          ]),
          foreseeable: q("Should the promisor reasonably expect the promise to induce action or forbearance?", [
            a("Yes", "actual"),
            a("No", "failForeseeable")
          ]),
          actual: q("Did the promisee actually rely on the promise?", [
            a("Yes", "reasonable"),
            a("No", "failReliance")
          ]),
          reasonable: q("Was the promisee's reliance reasonable?", [
            a("Yes", "injustice"),
            a("No", "failReasonable")
          ]),
          injustice: q("Is enforcement necessary to avoid injustice?", [
            a("Yes", "enforce"),
            a("No", "failInjustice")
          ]),
          enforce: r("Promissory estoppel likely applies.", "The promise may be enforced because there was a clear promise, foreseeable reliance, actual reasonable reliance, and enforcement is needed to avoid injustice."),
          failPromise: r("Promissory estoppel likely fails.", "A vague statement, prediction, or negotiation point is usually not enough. Start with a clear promise."),
          failForeseeable: r("Promissory estoppel likely fails.", "The promisor must have reason to expect that the promise would induce reliance."),
          failReliance: r("Promissory estoppel likely fails.", "The promisee must actually rely on the promise."),
          failReasonable: r("Promissory estoppel likely fails.", "Reliance that is unreasonable is weak support for enforcement."),
          failInjustice: r("Promissory estoppel likely fails.", "Even with reliance, the court asks whether enforcement is necessary to avoid injustice.")
        }
      }
    };

    let active = "forms";
    let paths = {};

    function q(question, choices) {
      return { type: "question", question, choices };
    }
    function a(label, next) {
      return { label, next };
    }
    function r(title, text) {
      return { type: "result", title, text };
    }
    function init() {
      Object.keys(flows).forEach(key => paths[key] = [{ id: flows[key].start, answer: null }]);
      renderTabs();
      render();
    }
    function renderTabs() {
      document.getElementById("tabs").innerHTML = Object.entries(flows).map(([key, flow]) => {
        return `<button class="tab" data-tab="${key}" aria-selected="${key === active}"><i></i><span>${flow.title}</span></button>`;
      }).join("");
      document.querySelectorAll("[data-tab]").forEach(tab => {
        tab.addEventListener("click", () => {
          active = tab.dataset.tab;
          renderTabs();
          render();
        });
      });
    }
    function render() {
      const flow = flows[active];
      const path = paths[active];
      document.getElementById("title").textContent = flow.title;
      renderReference(flow);
      renderPathway(flow, path);
      updateProgress(flow, path);
      highlightReference(flow, path);
    }
    function renderReference(flow) {
      document.getElementById("reference").innerHTML = flow.refs.map(([id, title, text]) => {
        return `<div class="ref-card" data-ref="${id}"><strong>${title}</strong><p>${text}</p></div>`;
      }).join("");
    }
    function renderPathway(flow, path) {
      const pathway = document.getElementById("pathway");
      pathway.innerHTML = path.map((entry, index) => {
        const node = flow.nodes[entry.id];
        if (node.type === "result") {
          return `<article class="step result" id="step-${index}">
            <div class="step-head"><span class="step-number">OK</span><span class="small">Result</span></div>
            <div class="question">${node.title}</div>
            <div class="result-text">${node.text}</div>
          </article>`;
        }
        const choices = node.choices.map(choice => {
          const selected = entry.answer === choice.label ? " selected" : "";
          return `<button class="choice${selected}" data-step="${index}" data-next="${choice.next}" data-label="${choice.label}">${choice.label}</button>`;
        }).join("");
        return `<article class="step" id="step-${index}">
          <div class="step-head"><span class="step-number">${index + 1}</span><span class="small">Question ${index + 1}</span></div>
          <div class="question">${node.question}</div>
          <div class="choices">${choices}</div>
        </article>`;
      }).join("");
      pathway.querySelectorAll(".choice").forEach(button => {
        button.addEventListener("click", () => choose(Number(button.dataset.step), button.dataset.label, button.dataset.next));
      });
    }
    function updateProgress(flow, path) {
      const hasResult = flow.nodes[path[path.length - 1].id].type === "result";
      const pct = hasResult ? 100 : Math.min(92, 18 + path.length * 13);
      document.getElementById("progressFill").style.setProperty("--progress", pct + "%");
    }
    function highlightReference(flow, path) {
      const current = path[path.length - 1].id;
      const activeRef = flow.refMap[current];
      document.querySelectorAll("[data-ref]").forEach(card => {
        card.classList.toggle("active", card.dataset.ref === activeRef);
      });
    }
    function choose(stepIndex, label, next) {
      const nextPath = paths[active].slice(0, stepIndex + 1);
      nextPath[stepIndex] = { ...nextPath[stepIndex], answer: label };
      nextPath.push({ id: next, answer: null });
      paths[active] = nextPath;
      render();
      setTimeout(() => {
        const el = document.getElementById(`step-${stepIndex + 1}`);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, 30);
    }
    document.getElementById("restart").addEventListener("click", () => {
      paths[active] = [{ id: flows[active].start, answer: null }];
      render();
    });
    document.getElementById("copy").addEventListener("click", async () => {
      const path = paths[active];
      const last = path[path.length - 1];
      const node = flows[active].nodes[last.id];
      const text = node.type === "result" ? `${node.title}\n\n${node.text}` : node.question;
      await navigator.clipboard.writeText(text);
      document.getElementById("copy").textContent = "Copied";
      setTimeout(() => document.getElementById("copy").textContent = "Copy current result", 1000);
    });
    init();
  </script>
</body>
</html>
